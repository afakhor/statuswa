<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>3D Gold Globe</title>

  <!-- Meta Open Graph Minimalis -->
  <meta property="og:title" content="3D Gold Globe">
  <meta property="og:image" content="https://afakhor.github.io/statuswa/icons/Icon-192.png">
  <meta property="og:url" content="https://afakhor.github.io/statuswa/">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & Favicon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="statuswa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="stylesheet" type="text/css" href="stylesheet.css">

  <style>
    /* Menghilangkan scrollbar dan membuat background hitam penuh */
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Watermark Judul di Pojok Kanan Atas */
    #watermark-title {
      position: absolute;
      top: 16px;
      right: 20px;
      color: rgba(255, 215, 0, 0.6); /* Warna Emas Transparan */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      z-index: 99999;
      pointer-events: none; /* Agar tidak mengganggu sentuhan/gesture ke Globe 3D */
    }
  </style>
</head>
<body>

  <!-- Watermark Pojok Kanan Atas -->
  <div id="watermark-title">3D GOLD GLOBE</div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
