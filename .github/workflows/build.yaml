name: Flutter Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repositori
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java untuk build Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Gunakan versi SDK yang sesuai dengan pubspec.yaml kamu
          flutter-version: '3.22.0' 

      # 4. Ambil semua dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Jalankan Linter untuk mengecek kesalahan sintaks
      - name: Analyze code
        run: flutter analyze

      # 6. Build APK Android (Shader IMPeller/GLSL akan otomatis terkompilasi)
      - name: Build Android APK
        run: flutter build apk --release

      # 7. Upload hasil APK ke GitHub Artifacts (Bisa diunduh setelah build selesai)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
